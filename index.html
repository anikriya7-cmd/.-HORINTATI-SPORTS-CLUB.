<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HORINTATI SPORTS CLUB</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:#fff;

    background:
    linear-gradient(
        rgba(0,20,50,.55),
        rgba(0,10,30,.72)
    ),
    url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=2000&q=90");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* DARK OVERLAY */

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.15);
    pointer-events:none;
    z-index:-1;
}

/* MAIN */

.container{
    width:94%;
    max-width:1250px;
    margin:auto;
}

/* HEADER */

header{
    text-align:center;
    padding:28px 10px 20px;
}

.logo{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#071b4b,#ffd000);
    border:3px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

header h1{
    margin:10px 0 4px;
    font-size:clamp(28px,5vw,55px);
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 4px 15px #000;
}

header h1 span{
    color:#ffd000;
}

header p{
    margin:0;
    font-size:16px;
    font-weight:bold;
    letter-spacing:4px;
}

/* ICON MENU */

nav{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;

    padding:10px;
    margin-bottom:18px;

    background:rgba(0,15,40,.72);
    border:1px solid rgba(255,255,255,.35);
    border-radius:18px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.nav-btn{
    border:none;
    color:#fff;
    min-height:78px;
    border-radius:14px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:.25s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.nav-btn .icon{
    font-size:29px;
}

.nav-btn:hover{
    transform:translateY(-4px) scale(1.02);
    filter:brightness(1.15);
}

.notice-btn{
    background:linear-gradient(135deg,#087cf5,#0646a8);
}

.member-btn{
    background:linear-gradient(135deg,#00a86b,#006b43);
}

.admin-btn{
    background:linear-gradient(135deg,#ff4050,#c90018);
}

.players-btn{
    background:linear-gradient(135deg,#7046e8,#40169c);
}

.contact-btn{
    background:linear-gradient(135deg,#ff9d16,#e65c00);
}

.blood-btn{
    background:linear-gradient(135deg,#11aebe,#006d78);
}

/* SECTION */

.section{
    display:none;

    background:rgba(255,255,255,.93);
    color:#172033;

    padding:22px;
    margin-bottom:25px;

    border-radius:20px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.8);

    backdrop-filter:blur(12px);

    animation:showSection .3s ease;
}

.section.active{
    display:block;
}

@keyframes showSection{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* SECTION TITLE */

.section h2{
    margin:0 0 18px;
    padding:14px 18px;

    color:#fff;

    border-radius:12px;

    background:linear-gradient(90deg,#086ee8,#092d70);

    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* NOTICE */

#notice{
    min-height:210px;
}

.notice-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.notice-title span{
    font-size:30px;
}

#notice-list{
    font-size:17px;
    line-height:1.9;
}

.notice-item{
    padding:12px 15px;
    margin:8px 0;

    background:linear-gradient(
        90deg,
        rgba(10,111,230,.12),
        rgba(255,255,255,.8)
    );

    border-left:5px solid #087cf5;
    border-radius:8px;
}

/* CARD */

.card{
    border:1px solid #dbe2ef;
    padding:15px;
    margin:12px 0;
    border-radius:14px;

    display:flex;
    gap:15px;
    align-items:center;

    background:#fff;

    box-shadow:0 5px 18px rgba(0,0,0,.08);

    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 22px rgba(0,0,0,.13);
}

.card img{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #087cf5;
}

.card h3{
    margin:0 0 7px;
    color:#092d70;
}

.card p{
    margin:3px 0;
}

/* INPUT */

input,
select{
    display:block;
    width:100%;

    margin:10px 0;
    padding:13px;

    box-sizing:border-box;

    border:1px solid #cdd6e4;
    border-radius:9px;

    outline:none;
    font-size:15px;

    background:#fff;
}

input:focus{
    border-color:#087cf5;
    box-shadow:0 0 0 3px rgba(8,124,245,.12);
}

/* BUTTON */

.action-btn{
    padding:12px 20px;
    cursor:pointer;

    border:none;
    background:linear-gradient(135deg,#087cf5,#0646a8);
    color:white;

    border-radius:9px;
    font-size:15px;
    font-weight:bold;

    box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.action-btn:hover{
    filter:brightness(1.1);
}

/* ADMIN */

.admin-box{
    background:#f5f8fc;
    padding:18px;
    border-radius:14px;
    margin-top:15px;
    border:1px solid #dde5ef;
}

.admin-box h3,
.admin-box h4{
    color:#092d70;
}

/* MEMBER PROFILE */

#member-profile{
    margin-top:20px;
}

.profile-box{
    text-align:center;
    padding:20px;
    border-radius:15px;
    background:linear-gradient(135deg,#f4f8ff,#fff);
    border:1px solid #dce5f3;
}

.profile-box img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid #087cf5;
    box-shadow:0 7px 20px rgba(0,0,0,.2);
}

/* FOOTER */

footer{
    text-align:center;
    padding:25px 10px;
    font-size:13px;
    color:#fff;
    text-shadow:0 2px 5px #000;
}

/* MOBILE */

@media(max-width:850px){

    nav{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:520px){

    .container{
        width:96%;
    }

    header{
        padding-top:18px;
    }

    .logo{
        width:70px;
        height:70px;
        font-size:34px;
    }

    header h1{
        font-size:27px;
    }

    header p{
        font-size:11px;
        letter-spacing:2px;
    }

    nav{
        grid-template-columns:repeat(3,1fr);
        gap:7px;
        padding:7px;
    }

    .nav-btn{
        min-height:72px;
        font-size:11px;
    }

    .nav-btn .icon{
        font-size:24px;
    }

    .section{
        padding:13px;
        border-radius:15px;
    }

    .card{
        padding:10px;
    }

    .card img{
        width:65px;
        height:65px;
    }

}

</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">⚽</div>

    <h1>
        HORINTATI <span>SPORTS CLUB</span>
    </h1>

    <p>PLAY • UNITY • BROTHERHOOD</p>

</header>


<!-- ICON MENU -->

<nav>

    <button class="nav-btn notice-btn" onclick="show('notice')">
        <div class="icon">📢</div>
        Notice Board
    </button>

    <button class="nav-btn member-btn" onclick="show('member')">
        <div class="icon">👤</div>
        Member Login
    </button>

    <button class="nav-btn admin-btn" onclick="show('admin')">
        <div class="icon">⚙️</div>
        Admin Login
    </button>

    <button class="nav-btn players-btn" onclick="show('players')">
        <div class="icon">👥</div>
        Player List
    </button>

    <button class="nav-btn contact-btn" onclick="show('contact')">
        <div class="icon">📞</div>
        Contact
    </button>

    <button class="nav-btn blood-btn" onclick="show('blood')">
        <div class="icon">🩸</div>
        Blood Group
    </button>

</nav>


<!-- NOTICE -->

<div id="notice" class="section active">

    <h2 class="notice-title">
        <span>📢 Notice Board</span>
        <span>⚽</span>
    </h2>

    <div id="notice-list">
        কোনো নোটিশ নেই।
    </div>

</div>


<!-- MEMBER LOGIN -->

<div id="member" class="section">

    <h2>👤 Member Login</h2>

    <input
        type="text"
        id="m-no"
        placeholder="Member No"
    >

    <input
        type="password"
        id="m-pass"
        placeholder="Password"
    >

    <button class="action-btn" onclick="memberLogin()">
        Login
    </button>

    <div id="member-profile"></div>

</div>


<!-- ADMIN -->

<div id="admin" class="section">

    <h2>⚙️ Admin Login</h2>

    <div id="admin-auth">

        <input
            type="password"
            id="admin-pass"
            placeholder="Admin Password"
        >

        <button class="action-btn" onclick="adminLogin()">
            Login
        </button>

    </div>


    <div id="admin-panel"
         class="admin-box"
         style="display:none;">

        <h3>Admin Dashboard</h3>


        <h4>📢 Add Notice</h4>

        <input
            type="text"
            id="new-notice"
            placeholder="Notice Text"
        >

        <button class="action-btn" onclick="addNotice()">
            Add Notice
        </button>


        <h4>👤 Add Member</h4>

        <input
            type="file"
            id="new-pic"
            accept="image/*"
        >

        <input
            type="text"
            id="new-name"
            placeholder="Member Name"
        >

        <input
            type="text"
            id="new-jersey"
            placeholder="Jersey Number"
        >

        <input
            type="text"
            id="new-pos"
            placeholder="Position"
        >

        <input
            type="text"
            id="new-mno"
            placeholder="Member No"
        >

        <input
            type="password"
            id="new-mpass"
            placeholder="Member Password"
        >

        <input
            type="text"
            id="new-blood"
            placeholder="Blood Group"
        >

        <input
            type="text"
            id="new-phone"
            placeholder="Contact No"
        >

        <button class="action-btn" onclick="addMember()">
            Add Member
        </button>

    </div>

</div>


<!-- PLAYERS -->

<div id="players" class="section">

    <h2>👥 Player List</h2>

    <div id="player-list"></div>

</div>


<!-- CONTACT -->

<div id="contact" class="section">

    <h2>📞 Contact</h2>

    <div id="contact-list"></div>

</div>


<!-- BLOOD -->

<div id="blood" class="section">

    <h2>🩸 Blood Group</h2>

    <div id="blood-list"></div>

</div>


<footer>
    © HORINTATI SPORTS CLUB
</footer>

</div>


<script>

/* =========================================================
   FIREBASE CONFIG
   তোমার Firebase URL একদম অপরিবর্তিত রাখা হয়েছে
========================================================= */

const firebaseConfig = {
    databaseURL:
    "https://horintati-sports-club-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================================================
   SECTION SHOW
========================================================= */

function show(id){

    document
    .querySelectorAll('.section')
    .forEach(function(section){

        section.classList.remove('active');

    });

    document
    .getElementById(id)
    .classList.add('active');

}


/* =========================================================
   LIVE NOTICE DATA
========================================================= */

db.ref('notices').on('value', function(snap){

    let html = '';

    snap.forEach(function(child){

        html += `
            <div class="notice-item">
                📢 ${child.val()}
            </div>
        `;

    });

    document.getElementById('notice-list').innerHTML =
        html || 'কোনো নোটিশ নেই।';

});


/* =========================================================
   LIVE MEMBERS DATA
========================================================= */

db.ref('members').on('value', function(snap){

    let playersHtml = '';
    let contactHtml = '';
    let bloodHtml = '';

    snap.forEach(function(child){

        let m = child.val();

        let img = m.pic
            ? `<img src="${m.pic}" alt="Player">`
            : '';

        playersHtml += `
            <div class="card">

                ${img}

                <div>

                    <h3>${m.name || ''}</h3>

                    <p>
                        <strong>Jersey:</strong>
                        ${m.jersey || ''}
                    </p>

                    <p>
                        <strong>Position:</strong>
                        ${m.pos || ''}
                    </p>

                </div>

            </div>
        `;


        contactHtml += `
            <div class="card">

                ${img}

                <div>

                    <h3>${m.name || ''}</h3>

                    <p>
                        📞 <strong>Phone:</strong>
                        ${m.phone || ''}
                    </p>

                </div>

            </div>
        `;


        bloodHtml += `
            <div class="card">

                ${img}

                <div>

                    <h3>${m.name || ''}</h3>

                    <p>
                        🩸 <strong>Blood Group:</strong>
                        ${m.blood || ''}
                    </p>

                </div>

            </div>
        `;

    });


    document.getElementById('player-list').innerHTML =
        playersHtml;

    document.getElementById('contact-list').innerHTML =
        contactHtml;

    document.getElementById('blood-list').innerHTML =
        bloodHtml;

});


/* =========================================================
   ADMIN LOGIN
   আগের Password অপরিবর্তিত
========================================================= */

function adminLogin(){

    if(
        document.getElementById('admin-pass').value
        === '@#$@#$@#$'
    ){

        document.getElementById('admin-auth')
        .style.display = 'none';

        document.getElementById('admin-panel')
        .style.display = 'block';

    }else{

        alert('ভুল পাসওয়ার্ড!');

    }

}


/* =========================================================
   ADD NOTICE
========================================================= */

function addNotice(){

    let text =
        document.getElementById('new-notice').value;

    if(text){

        db.ref('notices').push(
            text,
            function(){

                alert('নোটিশ যুক্ত হয়েছে!');

                document.getElementById(
                    'new-notice'
                ).value = '';

            }
        );

    }

}


/* =========================================================
   ADD MEMBER
========================================================= */

function addMember(){

    let file =
        document.getElementById('new-pic')
        .files[0];

    let name =
        document.getElementById('new-name')
        .value;

    let jersey =
        document.getElementById('new-jersey')
        .value;

    let pos =
        document.getElementById('new-pos')
        .value;

    let mno =
        document.getElementById('new-mno')
        .value;

    let mpass =
        document.getElementById('new-mpass')
        .value;

    let blood =
        document.getElementById('new-blood')
        .value;

    let phone =
        document.getElementById('new-phone')
        .value;


    if(!mno || !mpass){

        alert(
            'Member No এবং Password আবশ্যক!'
        );

        return;

    }


    let save = function(picData){

        db.ref('members/' + mno).set({

            name: name,

            jersey: jersey,

            pos: pos,

            mno: mno,

            mpass: mpass,

            blood: blood,

            phone: phone,

            pic: picData || ''

        }, function(){

            alert('মেম্বার যুক্ত হয়েছে!');


            document
            .getElementById('admin-panel')
            .querySelectorAll('input')
            .forEach(function(i){

                i.value = '';

            });

        });

    };


    if(file){

        let r = new FileReader();

        r.onload = function(e){

            save(e.target.result);

        };

        r.readAsDataURL(file);

    }else{

        save('');

    }

}


/* =========================================================
   MEMBER LOGIN
========================================================= */

function memberLogin(){

    let mno =
        document.getElementById('m-no').value;

    let pass =
        document.getElementById('m-pass').value;


    db.ref('members/' + mno)
    .once('value', function(snap){

        let m = snap.val();


        if(m && m.mpass === pass){

            let img = m.pic
                ? `
                    <img
                        src="${m.pic}"
                        alt="Member"
                    >
                  `
                : '';


            document.getElementById(
                'member-profile'
            ).innerHTML = `

                <div class="profile-box">

                    ${img}

                    <h3>
                        ${m.name || ''}
                    </h3>

                    <p>
                        <strong>
                            MEMBER NAME:
                        </strong>
                        ${m.name || ''}
                    </p>

                    <p>
                        <strong>
                            JERSY NUMBER:
                        </strong>
                        ${m.jersey || ''}
                    </p>

                    <p>
                        <strong>
                            POSITION:
                        </strong>
                        ${m.pos || ''}
                    </p>

                    <p>
                        <strong>
                            MEMBER NO:
                        </strong>
                        ${m.mno || ''}
                    </p>

                    <p>
                        <strong>
                            Blood group:
                        </strong>
                        ${m.blood || ''}
                    </p>

                    <p>
                        <strong>
                            Contact no:
                        </strong>
                        ${m.phone || ''}
                    </p>

                </div>

            `;

        }else{

            alert(
                'ভুল Member No অথবা Password!'
            );

        }

    });

}

</script>

</body>
            </html>
